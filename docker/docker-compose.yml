version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: acougue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-acougue}
      POSTGRES_USER: ${DB_USER:-acougue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acougue}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-acougue}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
